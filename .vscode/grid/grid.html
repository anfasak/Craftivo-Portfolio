<html lang="en">
<head>

            background-color: blue;
            padding: 10px;
        }
        .container{
            display: grid;
            grid-template-columns: auto 200px auto;
            grid-template-rows: auto auto auto;
            height: 800px;
            /* column-gap: 20px; */

            gap:20px 50px;
            color: white;

        }
        .con{
            /* grid-column-start: 1;
            grid-column-end: 2; */
            grid-row-start: 2;
            grid-row-end: 3;
            /* grid-column: 1/span 2;
            grid-row: 3/5; */
            /* grid-area: 3/1/5/3; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="con">
            1
        </div>
        <div>
            2
        </div>
        <div>
            3
        </div>
        <div>
            4
        </div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>

    </div>

</body>
</html>
