<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container div{
            background-color: yellow;
            padding: 10px;
        }
        .container{
            display: grid;
            /* grid-template-columns: auto auto auto ; */
            /* grid-template-rows: auto auto auto ; */
            gap: 20px;
            height: 800px;
            color: white;
            font-size: 20px;
            
        }
        .first{
            grid-column: 1/5;
            grid-row: 1/3;
        }
        .second{
            grid-area: 3/1/7/2;
        }
        .fourth{
            grid-area:3/3/4/5;
        }
        .fifth{
            grid-area:4/2/5/4;
        }
        .tenth{
            grid-area:6/2/7/5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="first">
            1
        </div>
        <div class="second">
            2
        </div>
        <div>3</div>
        <div class="fourth">4</div>
        <div class="fifth">5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div class="tenth">10</div>

    </div>
</body>
</html>
