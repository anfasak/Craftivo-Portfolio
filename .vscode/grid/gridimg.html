<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container div{
            padding: 10px;
            
        }
        .container{
            display: grid;
            height: 400px;
            gap: 20px;
            grid-template-columns: 300px 300px 300px;
            grid-template-rows: 300px 300px 300px;
           
        }
        img{
            height: 100%;
            width: 100%;
        }
        .fr3{
            grid-area: 1/3/3/5;
        }
        .fr1{
            grid-area:1/1/2/2
        }
        .fr4{
            grid-area:2/1/3/3
        }
        .fr5{
            grid-area:3/1/4/3;
        }
        .fr6{
            grid-area:3/3/4/5;
        }
        
    </style>
</head>
<body>
   
        <div class="container">
            <div class=".fr1">
                <img src="fruits.png">

            </div>
            <div>
                <img src="fruits1.png">
            </div>
            <div class="fr3">
                <img src="fruits2.png">
            </div>
            <div class="fr4">
                <img src="fruits3.png">
            </div>
            <div class="fr5">
                <img src="fruits4.png">
            </div>
            <div class="fr6"> 
                <img src="fruits5.png">
            </div>
        </div>
    </body>
    </html>
</body>
</html>
